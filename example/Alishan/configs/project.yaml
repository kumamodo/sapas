# ==========================================
# Station Configuration
# ==========================================

# Define connectivity for all physical hardware units
LINK:
  # --- MAIN DUT: Primary Device Under Test ---
  main_dut:
    type: ssh                          # Connection type: supports ssh, adb, com
    # source_ip: "192.168.1.100"       # [Optional] Local PC network interface IP. Leave empty to use OS routing
    host: 192.168.1.110                # Device IP address
    user: kumamodo                     # Login username
    password: ''                       # Login password
    stop_chars: ':~$'                  # [Optional] Shell prompt termination characters

  main_mcu:
    type: "udp"
    host: "192.168.1.111"
    server_port: 5088
    client_port: 5088
    # drain_timeout: 0.05              # [Optional] Timeout in seconds between consecutive UDP packet chunks (Default: 0.05)

  # --- Physical USB ADB Target ---
  adb_usb:
    type: adb                          # Connection type: ADB
    usb_serial: ""                     # [Optional] USB serial. Auto-discovers connected physical USB device.

  # --- Network (TCP/IP) ADB Target ---
  adb_network:
    type: adb                          # Connection type: ADB
    network_host: "192.168.1.110:5555" # [Required] Network host address (IP:Port) for Network ADB

  # --- Serial UART Port Target ---
  uart_device:
    type: uart
    port: "COM4"                       # [Required] Serial port name (e.g., COM3 on Windows, /dev/ttyUSB0 on Linux)
    baudrate: 115200                   # [Optional] Default: 115200
    timeout: 1                         # [Optional] Default: 1
    stop_chars: ":~$"                  # [Optional] Shell prompt characters to wait for
