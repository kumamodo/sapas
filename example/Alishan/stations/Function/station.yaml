
STATION_LOCATION: FA
FIXTURE_ID: 002

PSU_COM_PORT: COM9
PSU_BAUDRATE: 9600

FIXTURE_PLC_TYPE: SOCKET
FIXTURE_PLC_SOCKET_PORT: 5001
FIXTURE_CTL_SOCKET_PORT: 5002
TUI_SOCKET_PORT: 2003

NOISE_SENSOR_COM_PORT: COM25
NOISE_SENSOR_BAUDRATE: 9600

# [Optional] Station execution time limit in seconds (0 = unlimited)
STATION_TIMEOUT: 0

# Hardware Link Configurations
LINK:
  # GW-Instek Power Supply via Serial (COM port)
  main_psu:
    type: power_supply
    driver: gw_instek
    transport:
      type: uart
      port: "COM9"
      baudrate: 9600
      timeout: 1.0
    protection:
      max_voltage: 16.0     # 16V safety limit
      max_current: 5.0

# Station Environment Monitoring Targets (TUI F6 Monitor)
MONITOR:
  - name: "Local Gateway"
    host: "192.168.1.1"
  - name: "Fixture PLC"
    host: "192.168.1.50"
    port: 5001
  - name: "DUT (Device Under Test)"
    host: "192.168.1.100"
    port: 22



